name: Refresh dashboard data

# Auto-refresh for the public-data dashboards. Each dashboard folder exposes a
# standardized `refresh.py` that pulls live data and injects it into its HTML.
# This job runs them on a schedule (and on demand), then commits any changes so
# GitHub Pages redeploys automatically. New dashboards are picked up as soon as
# they add a `refresh.py` — no edits to this file required.

on:
  schedule:
    - cron: '17 9 * * 1'      # every Monday 09:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this dashboard folder (e.g. deposit-share). Blank = all.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: refresh-dashboards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Optional API keys — set as repo secrets. Scripts that need them read
      # these env vars; scripts that don't simply ignore them.
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run dashboard refresh scripts
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set +e
          total=0; failed=0; empty=0
          {
            echo "## Dashboard refresh"
            echo ""
            echo "| Dashboard | Result | Rows | Data as of |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for script in */refresh.py; do
            dir=$(dirname "$script")
            if [ -n "$ONLY" ] && [ "$dir" != "$ONLY" ]; then continue; fi
            total=$((total + 1))

            echo "::group::refresh $dir"
            python "$script"
            rc=$?
            echo "::endgroup::"

            # Read what the dashboard actually holds now. Exit code alone can't tell
            # "worked" from "ran but fetched nothing" — a script can exit 0 with zero
            # rows (dental did exactly that when NPPES was unreachable).
            state=$(python .github/scripts/dashboard_state.py "$dir")
            rows=$(echo "$state" | cut -d'|' -f1 | tr -d ' ')
            asof=$(echo "$state" | cut -d'|' -f2- | sed 's/^ *//')

            if [ "$rc" -ne 0 ]; then
              failed=$((failed + 1))
              echo "::warning title=Refresh failed::$dir exited $rc — data left unchanged (see the '$dir' log group)"
              echo "| \`$dir\` | ❌ exit $rc | $rows | $asof |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$rows" = "0" ]; then
              empty=$((empty + 1))
              echo "::warning title=No data::$dir exited 0 but its dashboard holds 0 rows — the source is probably unreachable"
              echo "| \`$dir\` | ⚠️ no rows | $rows | $asof |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$dir\` | ✅ | $rows | $asof |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          {
            echo ""
            echo "**$total run · $((total - failed - empty)) ok · $failed failed · $empty empty**"
          } >> "$GITHUB_STEP_SUMMARY"

          # Gate: a single flaky public source shouldn't nuke the whole refresh, but a
          # total outage should be loud. Partial problems stay green and surface as
          # warnings + the summary table above.
          if [ "$total" -gt 0 ] && [ "$((failed + empty))" -eq "$total" ]; then
            echo "::error title=Refresh produced nothing::all $total dashboard(s) failed or returned no rows"
            exit 1
          fi
          exit 0

      - name: Commit refreshed data
        run: |
          git config user.name  "ranger-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Auto-refresh dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi
